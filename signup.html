<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Artisan</title>
  <meta name="description" content="Create your free Artisan account to track orders and save your favorites." />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body class="auth-page">
  <div class="auth-bg" aria-hidden="true"></div>

  <div class="auth-wrap">
    <main class="auth-card auth-card-wide" aria-labelledby="signupTitle">
      <a href="index.html" class="auth-brand" aria-label="Artisan Homepage" style="text-decoration:none;">
        <span class="brand-crest" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 25h24c.6 0 1 .4 1 1s-.4 1-1 1H4c-.6 0-1-.4-1-1s.4-1 1-1z" fill="currentColor" opacity="0.6"/>
            <path d="M18 10c3-3 8-1 8 4s-4 7-7 11h-3c3-3 6-7 5-10-1-2-2-3-3-5z" fill="#9C2F43"/>
            <path d="M21 11c2.5-1.5 5 0 4.5 3s-3.5 5-5.5 8" stroke="#F4BAC3" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
            <polygon points="5,17 18,9 23,13 11,21" fill="currentColor" opacity="0.95"/>
            <polygon points="11,21 23,13 23,20 11,26" fill="currentColor"/>
            <polygon points="5,17 11,21 11,26 5,21" fill="currentColor" opacity="0.75"/>
            <ellipse cx="15" cy="18" rx="1.3" ry="0.9" fill="var(--color-cocoa-dark, #352820)"/>
            <ellipse cx="19" cy="16.5" rx="1" ry="0.8" fill="var(--color-cocoa-dark, #352820)"/>
            <ellipse cx="14" cy="23.5" rx="1.1" ry="0.8" fill="var(--color-cocoa-dark, #352820)"/>
            <ellipse cx="18" cy="22" rx="1.4" ry="1" fill="var(--color-cocoa-dark, #352820)"/>
            <circle cx="12" cy="7" r="1" fill="currentColor"/>
          </svg>
        </span>
        <span class="auth-brand-name">Artisan</span>
        <span class="auth-brand-tagline">Cheese &amp; Charcuterie</span>
      </a>

      <h1 class="auth-title" id="signupTitle">Create Account</h1>
      <p class="auth-subtitle">Create an account to get started.</p>

      <form class="auth-form" id="signupForm" novalidate>
        <div class="auth-grid-2">
          <div class="auth-field">
            <label class="auth-label" for="signupName">Full Name</label>
            <input class="form-control auth-input" type="text" id="signupName" name="name" placeholder="John Smith" autocomplete="name" required />
          </div>
          <div class="auth-field">
            <label class="auth-label" for="signupEmail">Email Address</label>
            <input class="form-control auth-input" type="email" id="signupEmail" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="auth-field">
            <label class="auth-label" for="signupPassword">Password</label>
            <div class="auth-input-wrap">
              <input class="form-control auth-input" type="password" id="signupPassword" name="password" placeholder="At least 8 characters" autocomplete="new-password" required />
              <button type="button" class="auth-toggle" data-toggle-password aria-controls="signupPassword" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="auth-field">
            <label class="auth-label" for="signupConfirm">Confirm Password</label>
            <div class="auth-input-wrap">
              <input class="form-control auth-input" type="password" id="signupConfirm" name="confirm" placeholder="Repeat your password" autocomplete="new-password" required />
              <button type="button" class="auth-toggle" data-toggle-password aria-controls="signupConfirm" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>

        <label class="auth-checkbox auth-terms" for="termsCheck">
          <input type="checkbox" id="termsCheck" required />
          <span>I agree to the <a class="auth-link" href="terms.html">Terms &amp; Conditions</a> and <a class="auth-link" href="privacy.html">Privacy Policy</a>.</span>
        </label>

        <button class="btn btn-primary auth-submit" type="submit">Create Account</button>
      </form>

      <div class="auth-divider" aria-hidden="true">or sign up with</div>

      <div class="auth-social">
        <a class="auth-social-btn" href="https://www.google.com" target="_blank" rel="noopener" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
          Google
        </a>
        <a class="auth-social-btn" href="https://www.facebook.com" target="_blank" rel="noopener" aria-label="Continue with Facebook">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.49h-2.8V24C19.62 23.1 24 18.1 24 12.07z"/></svg>
          Facebook
        </a>
        <a class="auth-social-btn" href="https://www.apple.com" target="_blank" rel="noopener" aria-label="Continue with Apple">
          <svg viewBox="0 0 384 512" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 2.1-52.7 16.3-69.9 36.9-16.3 19.1-30.1 50.4-26.4 72.5 31.4 2.6 54.6-5.2 72.3-36.9z"/></svg>
          Apple
        </a>
      </div>

      <p class="auth-redirect">Already have an account?<a href="login.html">Sign In</a></p>
    </main>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
